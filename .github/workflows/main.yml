name: Build poeapi.dll

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version (e.g., 1.0)'
        required: true
        default: '1.17'
        type: string

jobs:
  build:
    runs-on: windows-latest  

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4  

    - name: Setup MinGW
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-pkg-config
        path-type: minimal

    - name: Install dependencies
      shell: msys2 {0}  # 使用 MSYS2 shell
      run: |
        g++ --version
        echo "Dependencies prepared."
      
    - name: Build DLL
      shell: msys2 {0}
      run: |
        # 使用靜態連結減少對 MinGW 執行時期 DLL 的依賴
        g++ -g -std=c++14 -Iinclude -Llib -shared -o poeapi.dll -Wa,-mbig-obj PoETask.cpp \
            -static-libgcc -static-libstdc++ -Wl,-Bstatic -lstdc++ -lpthread -Wl,-Bdynamic \
            -lahkpp -lpsapi -lgdi32 -ldwmapi -lwinmm -ld3d11 -ldcomp -ld2d1 -ldwrite -liphlpapi -lsqlite3 -lcurl \
            -funwind-tables -fexceptions -frtti
        
        if [ -f "poeapi.dll" ]; then
          echo "Build successful!"
          # 檢查 DLL 相依性
          ldd poeapi.dll
        else
          echo "Build failed!"
          exit 1
        fi

    - name: Collect Dependencies
      shell: msys2 {0}
      run: |
        # 建立 ahk 目錄（如果不存在）並複製必要的 DLL
        mkdir -p ahk
        cp poeapi.dll ahk/
        
        # 複製 MSYS2 中的必要 DLL 到 ahk 目錄，確保載入不缺件
        cp /mingw64/bin/libcurl-*.dll ahk/ 2>/dev/null || true
        cp /mingw64/bin/zlib1.dll ahk/ 2>/dev/null || true
        cp /mingw64/bin/libsqlite3-*.dll ahk/ 2>/dev/null || true
        cp /mingw64/bin/libgcc_s_seh-*.dll ahk/ 2>/dev/null || true
        cp /mingw64/bin/libstdc++-*.dll ahk/ 2>/dev/null || true
        cp /mingw64/bin/libwinpthread-*.dll ahk/ 2>/dev/null || true


    - name: Prepare ahk Folder
      shell: powershell  
      run: |
        # 確保 ahk 目錄存在（Collect Dependencies 已經建立）
        if (-not (Test-Path "ahk")) { New-Item -ItemType Directory -Force -Path "ahk" }
        
        echo "DLL preparations completed in ahk/ folder."


    - name: Compress Folder
      shell: powershell
      run: |
        $version = "${{ github.event.inputs.version }}"
        
        $zipName = "PoEapikit-$version.zip"
        Compress-Archive -Path "ahk/*" -DestinationPath $zipName -Force
        
        if (Test-Path $zipName) {
          echo "Compression successful! ZIP: $zipName"
        } else {
          echo "Compression failed!"
          exit 1
        }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PoEapikit-${{ github.event.inputs.version }}
        path: PoEapikit-${{ github.event.inputs.version }}.zip
